<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-label="Boxplot der Faithfulness-Werte je Modell auf den 43 komplexen Fragen. Llama-3.3-70B hat eine sehr enge Box nahe 1,0 mit zehn Ausreissern nach unten. Mistral-24B liegt hoch mit moderater Streuung. GPT-OSS-120B und Llama-3.1-8B haben breite Boxen ueber den mittleren Wertebereich ohne Ausreisser aufgrund der bereits grossen Streuung.">
  <title>Faithfulness-Verteilung je Modell (43 komplexe Fragen)</title>
  <desc>Boxplot mit Median, Interquartilsabstand, Whiskern (1,5×IQR) und Ausreissern. Llama-3.3-70B: Median und Q3 bei 1,0, Q1 bei 0,981 — eine sehr enge Box, aber zehn von vierzig Werten (25%) liegen als statistische Ausreisser unterhalb, bis hinab zu 0,286. Mistral-24B: Median 0,909, ein Ausreisser bei 0,267. GPT-OSS-120B: Median 0,667, Interquartilsabstand 0,317 bis 0,936, keine Ausreisser da die Streuung selbst schon gross ist. Llama-3.1-8B: Median 0,625, Interquartilsabstand 0,333 bis 0,803, ebenfalls ohne separate Ausreisser.</desc>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- y-axis gridlines + labels -->
    <g font-size="11" fill="currentColor" opacity="0.75">
      <line x1="80" y1="40"  x2="600" y2="40"  stroke="currentColor" stroke-width="1" opacity="0.25" />
      <line x1="80" y1="115" x2="600" y2="115" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <line x1="80" y1="190" x2="600" y2="190" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <line x1="80" y1="265" x2="600" y2="265" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <line x1="80" y1="340" x2="600" y2="340" stroke="currentColor" stroke-width="1" opacity="0.5" />
      <text x="70" y="44"  text-anchor="end">1,0</text>
      <text x="70" y="119" text-anchor="end">0,75</text>
      <text x="70" y="194" text-anchor="end">0,5</text>
      <text x="70" y="269" text-anchor="end">0,25</text>
      <text x="70" y="344" text-anchor="end">0,0</text>
    </g>
    <text x="20" y="190" font-size="12" fill="currentColor" text-anchor="middle" transform="rotate(-90 20 190)">Faithfulness</text>

    <!-- Llama-3.3-70B (cx=145) -->
    <g stroke="currentColor" fill="none">
      <line x1="145" y1="40" x2="145" y2="40" stroke-width="1.4" />
      <line x1="145" y1="45.7" x2="145" y2="40" stroke-width="1.4" />
      <rect x="110" y="40" width="70" height="5.7" stroke-width="1.6" />
      <line x1="110" y1="40" x2="180" y2="40" stroke-width="2.2" />
      <line x1="133" y1="40" x2="157" y2="40" stroke-width="1.4" />
      <line x1="133" y1="45.7" x2="157" y2="45.7" stroke-width="1.4" />
    </g>
    <g fill="currentColor">
      <circle cx="145" cy="160.0" r="3" opacity="0.7" /><circle cx="145" cy="220.0" r="3" opacity="0.7" />
      <circle cx="145" cy="63.1" r="3" opacity="0.7" /><circle cx="145" cy="90.1" r="3" opacity="0.7" />
      <circle cx="145" cy="254.2" r="3" opacity="0.7" /><circle cx="145" cy="139.9" r="3" opacity="0.7" />
      <circle cx="145" cy="115.0" r="3" opacity="0.7" /><circle cx="145" cy="211.3" r="3" opacity="0.7" />
      <circle cx="145" cy="100.0" r="3" opacity="0.7" />
    </g>

    <!-- Mistral-24B (cx=275) -->
    <g stroke="currentColor" fill="none">
      <line x1="275" y1="40" x2="275" y2="40" stroke-width="1.4" />
      <line x1="275" y1="115" x2="275" y2="220" stroke-width="1.4" />
      <rect x="240" y="40" width="70" height="75" stroke-width="1.6" />
      <line x1="240" y1="67.3" x2="310" y2="67.3" stroke-width="2.2" />
      <line x1="263" y1="40" x2="287" y2="40" stroke-width="1.4" />
      <line x1="263" y1="220" x2="287" y2="220" stroke-width="1.4" />
    </g>
    <circle cx="275" cy="259.9" r="3" fill="currentColor" opacity="0.7" />

    <!-- GPT-OSS-120B (cx=405) -->
    <g stroke="currentColor" fill="none">
      <line x1="405" y1="40" x2="405" y2="59.2" stroke-width="1.4" />
      <line x1="405" y1="244.9" x2="405" y2="340" stroke-width="1.4" />
      <rect x="370" y="59.2" width="70" height="185.7" stroke-width="1.6" />
      <line x1="370" y1="139.9" x2="440" y2="139.9" stroke-width="2.2" />
      <line x1="393" y1="40" x2="417" y2="40" stroke-width="1.4" />
      <line x1="393" y1="340" x2="417" y2="340" stroke-width="1.4" />
