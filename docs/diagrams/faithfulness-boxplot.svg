    <!-- Llama-3.1-8B (cx=535) -->
    <g stroke="currentColor" fill="none">
      <line x1="535" y1="40" x2="535" y2="99.1" stroke-width="1.4" />
      <line x1="535" y1="240.1" x2="535" y2="340" stroke-width="1.4" />
      <rect x="500" y="99.1" width="70" height="141.0" stroke-width="1.6" />
      <line x1="500" y1="152.5" x2="570" y2="152.5" stroke-width="2.2" />
      <line x1="523" y1="40" x2="547" y2="40" stroke-width="1.4" />
      <line x1="523" y1="340" x2="547" y2="340" stroke-width="1.4" />
    </g>

    <!-- x-axis labels -->
    <g font-size="12" fill="currentColor" text-anchor="middle">
      <text x="145" y="365">Llama-3.3-</text><text x="145" y="379">70B</text>
      <text x="275" y="365">Mistral-</text><text x="275" y="379">24B</text>
      <text x="405" y="365">GPT-OSS-</text><text x="405" y="379">120B</text>
      <text x="535" y="365">Llama-3.1-</text><text x="535" y="379">8B</text>
    </g>
  </g>
</svg>
