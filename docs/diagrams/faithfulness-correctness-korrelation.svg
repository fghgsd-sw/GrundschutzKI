<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Gruppiertes Balkendiagramm der Pearson-Korrelation zwischen Faithfulness und Answer Correctness je Modell, getrennt nach Datensatz 43 Komplex und 123 Einfach. GPT-OSS-120B zeigt in beiden Datensaetzen deutlich positive Korrelation. Llama-3.3-70B und Llama-3.1-8B wechseln von negativer Korrelation bei komplexen Fragen zu positiver Korrelation bei einfachen Fragen. Mistral-24B bleibt in beiden Faellen nahe null.">
  <title>Korrelation Faithfulness ↔ Answer Correctness je Modell und Datensatz</title>
  <desc>Vier Modellgruppen mit je zwei Balken (43 Komplex dunkel, 123 Einfach hell) auf einer Nullachse. GPT-OSS-120B: r=0,374 (43 Komplex) und r=0,447 (123 Einfach), beide deutlich positiv. Llama-3.3-70B: r=-0,074 und r=0,202 — Vorzeichenwechsel. Llama-3.1-8B: r=-0,239 und r=0,304 — ebenfalls Vorzeichenwechsel. Mistral-24B: r=-0,028 und r=-0,043, durchgehend nahe null.</desc>

  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" />
    </pattern>
  </defs>

  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- gridlines -->
    <g font-size="11" fill="currentColor" opacity="0.75">
      <line x1="70" y1="40"  x2="600" y2="40"  stroke="currentColor" stroke-width="1" opacity="0.2" />
      <line x1="70" y1="227.5" x2="600" y2="227.5" stroke="currentColor" stroke-width="1.4" opacity="0.6" />
      <line x1="70" y1="340" x2="600" y2="340" stroke="currentColor" stroke-width="1" opacity="0.2" />
      <text x="60" y="44" text-anchor="end">r = 0,5</text>
      <text x="60" y="231.5" text-anchor="end">r = 0</text>
      <text x="60" y="344" text-anchor="end">r = −0,3</text>
    </g>

    <!-- GPT-OSS-120B -->
    <rect x="102.5" y="87.2" width="32" height="140.3" fill="currentColor" />
    <rect x="150.5" y="59.9" width="32" height="167.6" fill="url(#hatch)" stroke="currentColor" stroke-width="1" />
    <text x="142.5" y="52" font-size="10.5" text-anchor="middle" fill="currentColor">+0,37 / +0,45</text>

    <!-- Llama-3.3-70B -->
    <rect x="227.5" y="227.5" width="32" height="27.7" fill="currentColor" />
    <rect x="275.5" y="151.8" width="32" height="75.7" fill="url(#hatch)" stroke="currentColor" stroke-width="1" />
    <text x="267.5" y="145" font-size="10.5" text-anchor="middle" fill="currentColor">−0,07 / +0,20</text>

    <!-- Llama-3.1-8B -->
    <rect x="352.5" y="227.5" width="32" height="89.6" fill="currentColor" />
    <rect x="400.5" y="113.5" width="32" height="114.0" fill="url(#hatch)" stroke="currentColor" stroke-width="1" />
    <text x="392.5" y="107" font-size="10.5" text-anchor="middle" fill="currentColor">−0,24 / +0,30</text>

    <!-- Mistral-24B -->
    <rect x="477.5" y="227.5" width="32" height="10.5" fill="currentColor" />
    <rect x="525.5" y="227.5" width="32" height="16.1" fill="url(#hatch)" stroke="currentColor" stroke-width="1" />
    <text x="517.5" y="221.5" font-size="10.5" text-anchor="middle" fill="currentColor">−0,03 / −0,04</text>

    <!-- x-axis labels -->
    <g font-size="12" fill="currentColor" text-anchor="middle">
      <text x="142.5" y="362">GPT-OSS-</text><text x="142.5" y="376">120B</text>
      <text x="267.5" y="362">Llama-3.3-</text><text x="267.5" y="376">70B</text>
      <text x="392.5" y="362">Llama-3.1-</text><text x="392.5" y="376">8B</text>
      <text x="517.5" y="362">Mistral-</text><text x="517.5" y="376">24B</text>
    </g>

    <!-- legend -->
    <g font-size="11" fill="currentColor">
      <rect x="360" y="8" width="16" height="12" fill="currentColor" />
      <text x="380" y="18">43 Komplex</text>
      <rect x="470" y="8" width="16" height="12" fill="url(#hatch)" stroke="currentColor" stroke-width="1" />
      <text x="490" y="18">123 Einfach</text>
    </g>
  </g>
</svg>
