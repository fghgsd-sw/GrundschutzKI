<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-label="Schichtenmodell des gski-chainlit-Containers: Praesentationsschicht, Anwendungslogik, Domaenendienste und Datenschicht, gestapelt mit geraden Pfeilen, plus einer gestrichelten Direktverbindung von den FastAPI-Routen zu den Domaenendiensten fuer admin-geschuetzte Exporte.">
  <title>Schichtenmodell — gski-chainlit</title>
  <desc>Vier gleich breite Schichten von oben nach unten: Praesentationsschicht, Anwendungslogik (app.py), Domaenendienste, Datenschicht. Gerade Pfeile verbinden benachbarte Schichten. Eine gestrichelte, rechtwinklige Kante fuehrt von der Praesentationsschicht direkt zu den Domaenendiensten und stellt den admin-geschuetzten Export-Zugriff dar, der die Anwendungslogik umgeht.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5793a" />
    </marker>
  </defs>

  <!-- vertical connectors: Praesentation -> Anwendung -> Domaene -> Daten -->
  <line x1="310" y1="108" x2="310" y2="144" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="310" y1="252" x2="310" y2="288" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="310" y1="416" x2="310" y2="452" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- bypass: FastAPI-Routen (Praesentation) direkt zu Domaenendiensten, rechtwinklig -->
  <polyline points="570,64 660,64 660,352 570,352" fill="none" stroke="#b5793a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-accent)" />
  <text x="675" y="208" font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#b5793a" text-anchor="middle" transform="rotate(-90 675 208)">Direktzugriff (Admin-Export)</text>

  <!-- Praesentationsschicht -->
  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="50" y="20" width="520" height="88" fill="none" stroke="currentColor" stroke-width="1.6" />
    <text x="70" y="44" font-size="14" font-weight="600" fill="currentColor">Präsentationsschicht</text>
    <line x1="66" y1="52" x2="554" y2="52" stroke="currentColor" stroke-width="1" opacity="0.45" />
    <text x="70" y="72" font-size="12" fill="currentColor">Chainlit-UI — Chat, Settings-Panel, Citation-Sidebar</text>
    <text x="70" y="92" font-size="12" fill="currentColor">FastAPI-Routen — Auth, Export, PDF-/Quellen-Serving</text>
  </g>

  <!-- Anwendungslogik -->
  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="50" y="144" width="520" height="108" fill="none" stroke="currentColor" stroke-width="1.6" />
    <text x="70" y="168" font-size="14" font-weight="600" fill="currentColor">Anwendungslogik — app.py</text>
    <line x1="66" y1="176" x2="554" y2="176" stroke="currentColor" stroke-width="1" opacity="0.45" />
    <text x="70" y="196" font-size="12" fill="currentColor">Dialogsteuerung (on_message, Tool-Call-Runden)</text>
    <text x="70" y="216" font-size="12" fill="currentColor">Zitations-Pipeline (Format → Validierung → Content-Judge)</text>
    <text x="70" y="236" font-size="12" fill="currentColor">Personalisierung &amp; Rollenprofile · Slash-Befehle</text>
  </g>

  <!-- Domaenendienste -->
  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="50" y="288" width="520" height="128" fill="none" stroke="currentColor" stroke-width="1.6" />
    <text x="70" y="312" font-size="14" font-weight="600" fill="currentColor">Domänendienste</text>
    <line x1="66" y1="320" x2="554" y2="320" stroke="currentColor" stroke-width="1" opacity="0.45" />
    <text x="70" y="340" font-size="12" fill="currentColor">rag_tool.py — Retrieval, Routing, Zitat-Auflösung</text>
    <text x="70" y="360" font-size="12" fill="currentColor">llm.py — LiteLLM-Abstraktion (Chat, Embedding)</text>
    <text x="70" y="380" font-size="12" fill="currentColor">upload_handler.py — sitzungsgebundenes Ephemeral-RAG</text>
    <text x="70" y="400" font-size="12" fill="currentColor">native_chat.py — Persistenzzugriff (SQL)</text>
  </g>

  <!-- Datenschicht -->
  <g font-family="ui-sans-serif, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="50" y="452" width="520" height="108" fill="none" stroke="currentColor" stroke-width="1.6" />
    <text x="70" y="476" font-size="14" font-weight="600" fill="currentColor">Datenschicht</text>
    <line x1="66" y1="484" x2="554" y2="484" stroke="currentColor" stroke-width="1" opacity="0.45" />
    <text x="70" y="504" font-size="12" fill="currentColor">Qdrant — Collection grundschutz_bge_m3</text>
    <text x="70" y="524" font-size="12" fill="currentColor">PostgreSQL — User, Thread, Feedback, Survey</text>
    <text x="70" y="544" font-size="12" fill="currentColor">IONOS AI Model Hub — Chat- &amp; Embedding-Modelle (extern)</text>
  </g>
</svg>
